name: Web CI Pipeline (ReactJS)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Node.js Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: đŸ“¥ Checkout Repository
        uses: actions/checkout@v4

      - name: đŸŸ¢ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: đŸ“¦ Install NPM Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "â„¹ï¸ No package.json found yet. Skipping npm install."
          fi

      - name: đŸ” ESLint Code Quality Check
        run: |
          if [ -f package.json ] && grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "â„¹ï¸ No lint script configured yet. Skipping."
          fi

      - name: đŸ§ª Run React Unit Tests
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test -- --watchAll=false
          else
            echo "â„¹ï¸ No test script configured yet. Skipping."
          fi

      - name: đŸ”¨ Production Web Build
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm run build
          else
            echo "â„¹ï¸ No build script configured yet. Skipping."
          fi