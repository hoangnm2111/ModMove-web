name: Web CD (production)

# A push to `production` builds the web image, pushes it to GHCR and redeploys it on the VPS.
# The VPS stack (compose, Caddy, deploy.sh) lives in ModMove-backend/deploy; see its README.
# Needs repository secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS and the variable DOMAIN.
on:
  push:
    branches: [ production ]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hoangnm2111/modmove-web

jobs:
  deploy:
    name: Build image, deploy
    # A manual run from another branch must not deploy it or overwrite `latest`.
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    env:
      # Until the VPS secrets exist, the run stops after pushing the image.
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and push image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" .
          docker push --all-tags "$IMAGE"

      - name: Set up SSH
        if: env.VPS_HOST != ''
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The VPS pulls with its own read-only ghcr.io login (ModMove-backend/deploy/README.md).
      - name: Deploy
        if: env.VPS_HOST != ''
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: ssh "$TARGET" "/opt/modmove/deploy.sh"

      - name: Check the site answers
        if: env.VPS_HOST != ''
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: curl -fsS --retry 12 --retry-delay 10 --retry-all-errors -o /dev/null "https://$DOMAIN/"
